# 격리 시험 DB. 운영·원격 DB가 아니라 이 컨테이너에만 시험을 붙인다.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: localone
      POSTGRES_PASSWORD: localone
      POSTGRES_DB: localone_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localone -d localone_test"]
      interval: 2s
      timeout: 3s
      retries: 15
